[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pulsesplit"
version = "0.1.0"
description = "Reproducible heart–lung audio source separation with a compact mask-estimation U-Net"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "torch>=2.0", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3"]
[project.optional-dependencies]
demo = ["streamlit>=1.34"]
test = ["pytest>=8.0"]
[project.scripts]
pulsesplit = "pulsesplit.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
